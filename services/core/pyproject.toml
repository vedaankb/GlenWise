[project]
name = "gleanwise"
version = "0.2.0"
description = "GleanWise core: search, fetch, retrieve, cited answers"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
classifiers = [
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
]
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.27.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "sse-starlette>=2.1.0",
  "litellm>=1.52.0",
  "beautifulsoup4>=4.12.0",
  "lxml>=5.3.0",
  "readability-lxml>=0.8.1",
  "playwright>=1.48.0",
  "protego>=0.3.1",
  "fastembed>=0.4.0",
  "numpy>=1.26.0",
  "prometheus-client>=0.21.0",
  "orjson>=3.10.0",
  "tenacity>=9.0.0",
  "sqlite-vec>=0.1.6",
  "reportlab>=4.2.0",
  "pypdf>=5.1",
  "keyring>=25.0",
  "python-socks[asyncio]>=2.4.0",
]

[project.optional-dependencies]
server = [
  "asyncpg>=0.30.0",
]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "pgserver>=0.1.4",
]

[project.scripts]
gleanwise = "gleanwise.cli:main"
gleanwise-core = "gleanwise.cli:serve"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gleanwise"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["live: needs network or a running stack (skipped by default)"]

[tool.coverage.run]
source = ["gleanwise"]
omit = ["gleanwise/testing/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "PERF", "C90", "SIM", "RUF", "T20"]
ignore = [
  "E501",   # line length handled by formatter
  "S101",   # assert is fine in tests and for invariants
  "S311",   # random is used for jitter only
  "S110",   # best-effort cleanup paths log or are intentionally silent
  "RUF012", # class-level mutable defaults are ClassVar-annotated where it matters
  "RUF001", "RUF002", "RUF003",  # intentional typographic / CJK characters in prompts and regexes
  "ASYNC109",  # explicit timeout parameters are part of our client APIs
  "PERF401", "SIM102", "SIM105", "SIM212", "RUF007", "UP042",  # style-only, clearer as written
]

[tool.ruff.lint.mccabe]
max-complexity = 14

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "C90", "T20", "PERF", "RUF059", "RUF015"]
"gleanwise/cli.py" = ["T20"]
"gleanwise/index/*.py" = ["S608"]  # SQL is assembled only from placeholders and validated integers

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
exclude = ["tests/"]
