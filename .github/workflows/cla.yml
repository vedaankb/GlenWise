# Copyright (C) 2026 Ved Buddaraju
# Requires contributors to sign CLA.md before merge.
# Signatures are stored on the `cla-signatures` branch of this repository.
#
# Optional: set repository secret PERSONAL_ACCESS_TOKEN (classic PAT with
# `repo` scope) if the default GITHUB_TOKEN cannot push to cla-signatures
# under your org's branch-protection rules. See:
# https://github.com/contributor-assistant/github-action

name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: CLA
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: >
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA' ||
          github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fallback when GITHUB_TOKEN cannot write the signatures branch:
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          branch: cla-signatures
          allowlist: bot*,dependabot[bot],pre-commit-ci[bot]
          remote-organization-name: ${{ github.repository_owner }}
          remote-repository-name: ${{ github.event.repository.name }}
